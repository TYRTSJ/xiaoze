<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>睡前体重记录 · 趋势图表</title>
<style>
  :root{
    --text:#1f2b45;
    --muted:#8390a9;
    --line:#eaeff8;
    --primary:#4f7cff;
    --primary2:#22d3a6;
    --up:#f2555a;
    --down:#18b981;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    padding:36px 16px 64px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 520px at 8% -12%, #dbe7ff 0%, transparent 62%),
      radial-gradient(820px 520px at 102% -4%, #d5fbef 0%, transparent 58%),
      linear-gradient(165deg,#eff5ff 0%,#e9fbf5 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  .app{width:min(96vw,900px);margin:0 auto;display:flex;flex-direction:column;gap:20px}

  /* ============ 顶部标题 ============ */
  .hero{text-align:center;padding:6px 0 2px}
  .hero h1{
    font-size:30px;letter-spacing:.5px;
    background:linear-gradient(100deg,#3d6bff,#12b98a 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{margin-top:8px;color:var(--muted);font-size:13.5px}

  /* ============ 通用卡片 ============ */
  .card{
    background:rgba(255,255,255,.86);
    border:1px solid rgba(255,255,255,.9);
    border-radius:22px;
    padding:22px;
    box-shadow:0 14px 36px rgba(31,56,102,.09);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  /* ============ 输入区 ============ */
  .form{display:grid;grid-template-columns:150px 1fr 1.5fr auto;gap:12px}
  .field{position:relative}
  .field label{
    display:block;margin-bottom:7px;font-size:12px;
    color:var(--muted);font-weight:600;letter-spacing:.3px;
  }
  .field input{
    width:100%;padding:12px 14px;
    border:1.5px solid #e2e9f5;border-radius:13px;
    background:#fbfdff;color:var(--text);
    font-size:14.5px;font-family:inherit;
    transition:.22s;
  }
  .field input::placeholder{color:#aeb9cd}
  .field input:focus{
    outline:none;border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 4px rgba(79,124,255,.12);
  }
  .field.btn-field{display:flex;align-items:flex-end}
  .add-btn{
    width:100%;padding:12px 22px;border:none;border-radius:13px;
    background:linear-gradient(120deg,#4f7cff,#22c9a3);
    color:#fff;font-size:14.5px;font-weight:700;font-family:inherit;
    cursor:pointer;white-space:nowrap;
    box-shadow:0 8px 20px rgba(79,124,255,.28);
    transition:.2s;
  }
  .add-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(79,124,255,.36)}
  .add-btn:active{transform:translateY(0) scale(.985)}

  /* ============ 数据概览 ============ */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{
    background:rgba(255,255,255,.86);
    border:1px solid rgba(255,255,255,.9);
    border-radius:18px;padding:16px 18px;
    box-shadow:0 10px 26px rgba(31,56,102,.07);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:.25s;
  }
  .stat:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(31,56,102,.12)}
  .stat .label{font-size:12px;color:var(--muted);font-weight:600}
  .stat .value{margin-top:8px;font-size:23px;font-weight:800;letter-spacing:-.3px}
  .stat .value small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
  .up{color:var(--up)}
  .down{color:var(--down)}

  /* ============ 图表 ============ */
  .chart-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:6px;
  }
  .chart-head h2{font-size:16.5px;font-weight:700}
  .chart-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{
    display:flex;gap:3px;padding:3px;
    background:#eef3fb;border-radius:11px;
  }
  .tab{
    padding:7px 13px;border:none;border-radius:9px;
    background:transparent;color:var(--muted);
    font-size:12.5px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.2s;
  }
  .tab.active{
    background:#fff;color:var(--primary);
    box-shadow:0 3px 9px rgba(31,56,102,.10);
  }
  .avg-toggle{
    display:flex;align-items:center;gap:6px;
    padding:8px 12px;border:1.5px solid #e2e9f5;border-radius:11px;
    background:#fbfdff;color:var(--muted);
    font-size:12.5px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.2s;
  }
  .avg-toggle.on{border-color:var(--primary);color:var(--primary);background:#f3f7ff}
  .avg-toggle i{
    width:16px;height:0;border-top:2px dashed currentColor;display:inline-block;
  }

  .chart-wrap{position:relative;margin-top:10px}
  #chart{display:block;width:100%;height:290px;cursor:crosshair}

  #tip{
    position:absolute;pointer-events:none;opacity:0;
    transform:translate(-50%,-128%);
    padding:9px 13px;border-radius:12px;
    background:rgba(31,43,69,.94);color:#fff;
    font-size:12.5px;line-height:1.55;white-space:nowrap;
    box-shadow:0 10px 24px rgba(31,43,69,.28);
    transition:opacity .15s;
    z-index:5;
  }
  #tip b{color:#7fe3c4;font-size:14px}
  #tip span{display:block;color:#b9c4d8;font-size:11.5px;margin-top:2px}

  /* ============ 记录表 ============ */
  .table-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .table-head h2{font-size:16.5px;font-weight:700}
  .table-head .count{color:var(--muted);font-size:12.5px;font-weight:600}
  .clear-btn{
    padding:7px 14px;border:1.5px solid #ffe0e0;border-radius:10px;
    background:#fff6f6;color:#e05555;
    font-size:12.5px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.2s;
  }
  .clear-btn:hover{background:#ffeaea;border-color:#ffc9c9}

  .table-scroll{max-height:390px;overflow:auto;border-radius:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{
    position:sticky;top:0;z-index:2;
    padding:11px 8px;
    background:#f6f9ff;color:#5f6d88;
    font-size:12.5px;font-weight:700;text-align:center;
    border-bottom:1px solid var(--line);
  }
  thead th:first-child{border-radius:14px 0 0 0}
  thead th:last-child{border-radius:0 14px 0 0}
  tbody td{
    padding:12px 8px;text-align:center;
    border-bottom:1px solid #f3f6fc;
    color:#3b4761;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .18s}
  tbody tr:hover{background:#f9fbff}
  tbody td.w{font-weight:800;font-size:15px;color:#1f2b45}
  .chip{
    display:inline-block;padding:3px 9px;border-radius:8px;
    font-size:12.5px;font-weight:700;
  }
  .chip.up{background:#fff0f0;color:var(--up)}
  .chip.down{background:#e9fbf3;color:var(--down)}
  .chip.flat{background:#f1f4fa;color:#8c98ae}
  .note-cell{color:var(--muted);font-size:13px;max-width:180px}
  .del{
    width:28px;height:28px;border:none;border-radius:9px;
    background:#fff2f2;color:#e05555;
    font-size:15px;line-height:1;cursor:pointer;transition:.2s;
  }
  .del:hover{background:#ffdede;transform:scale(1.08)}
  .empty{padding:44px 0;text-align:center;color:#a7b2c6;font-size:14px}

  @media(max-width:720px){
    body{padding:22px 12px 48px}
    .hero h1{font-size:24px}
    .form{grid-template-columns:1fr 1fr}
    .form .note-field{grid-column:1/-1}
    .form .btn-field{grid-column:1/-1}
    .stats{grid-template-columns:1fr 1fr}
    .card{padding:18px;border-radius:18px}
    #chart{height:230px}
  }
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <h1>🌙 睡前体重记录</h1>
    <p>数据仅保存在本机浏览器 · 每天同一时间测量更准确</p>
  </div>

  <!-- 输入 -->
  <div class="card">
    <div class="form">
      <div class="field">
        <label>日期</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label>体重 (kg)</label>
        <input type="number" id="weight" step="0.1" min="20" max="300" placeholder="如 62.5">
      </div>
      <div class="field note-field">
        <label>备注</label>
        <input type="text" id="note" maxlength="24" placeholder="晚餐 / 运动 / 睡眠（可选）">
      </div>
      <div class="field btn-field">
        <button class="add-btn" id="add">＋ 记录</button>
      </div>
    </div>
  </div>

  <!-- 概览 -->
  <div class="stats" id="stats"></div>

  <!-- 图表 -->
  <div class="card">
    <div class="chart-head">
      <h2>📈 体重趋势</h2>
      <div class="chart-tools">
        <div class="tabs">
          <button class="tab" data-range="7">近 7 天</button>
          <button class="tab active" data-range="30">近 30 天</button>
          <button class="tab" data-range="0">全部</button>
        </div>
        <button class="avg-toggle on" id="avgBtn"><i></i>均线</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="tip"></div>
    </div>
  </div>

  <!-- 记录表 -->
  <div class="card">
    <div class="table-head">
      <h2>📋 记录明细 <span class="count" id="count"></span></h2>
      <button class="clear-btn" id="clear">清空全部</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>星期</th>
            <th>体重</th>
            <th>较前次</th>
            <th>备注</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const KEY = 'bedtime-weight-records';
const WEEK = ['日','一','二','三','四','五','六'];

let records = [];
try { records = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ records = []; }

let range = 30;      // 0 = 全部
let showAvg = true;
let hoverIndex = -1;
let chartPoints = [];

const $ = id => document.getElementById(id);
const dateInput = $('date'), weightInput = $('weight'), noteInput = $('note');
const tbody = $('tbody'), statsBox = $('stats'), countBox = $('count');
const canvas = $('chart'), ctx = canvas.getContext('2d');
const tip = $('tip');

/* 默认今天 */
(function initDate(){
  const d = new Date();
  dateInput.value = d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
})();

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(records)); } catch(e){}
}

/* 按日期升序 */
function sorted(){
  return records.slice().sort((a,b)=> a.date.localeCompare(b.date));
}

/* 依据范围筛选 */
function filtered(){
  const all = sorted();
  if (!range) return all;
  if (all.length === 0) return all;
  const last = new Date(all[all.length-1].date + 'T00:00:00');
  const from = new Date(last);
  from.setDate(from.getDate() - (range - 1));
  return all.filter(r => new Date(r.date + 'T00:00:00') >= from);
}

/* =========================================================
   概览卡片
   ========================================================= */
function renderStats(){
  const all = sorted();
  if (all.length === 0){ statsBox.innerHTML = ''; return; }

  const weights = all.map(r => r.weight);
  const latest = weights[weights.length-1];
  const first  = weights[0];
  const total  = latest - first;
  const recent = weights.slice(-7);
  const avg    = recent.reduce((a,b)=>a+b,0) / recent.length;

  const cls = v => v > 0.05 ? 'up' : (v < -0.05 ? 'down' : '');
  const sign = v => (v > 0 ? '+' : '') + v.toFixed(1);

  statsBox.innerHTML = `
    <div class="stat">
      <div class="label">记录天数</div>
      <div class="value">${all.length}<small>天</small></div>
    </div>
    <div class="stat">
      <div class="label">最新体重</div>
      <div class="value">${latest.toFixed(1)}<small>kg</small></div>
    </div>
    <div class="stat">
      <div class="label">累计变化</div>
      <div class="value ${cls(total)}">${sign(total)}<small>kg</small></div>
    </div>
    <div class="stat">
      <div class="label">近 7 次平均</div>
      <div class="value">${avg.toFixed(1)}<small>kg</small></div>
    </div>`;
}

/* =========================================================
   图表
   ========================================================= */
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = Math.round(rect.width  * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { W: rect.width, H: rect.height };
}

/* 平滑曲线路径 */
function curvePath(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=0; i<pts.length-1; i++){
    const p0 = pts[i], p1 = pts[i+1];
    const mx = (p0.x + p1.x) / 2;
    ctx.bezierCurveTo(mx, p0.y, mx, p1.y, p1.x, p1.y);
  }
}

function drawChart(reveal = 1){
  const { W, H } = resizeCanvas();
  ctx.clearRect(0, 0, W, H);

  const data = filtered();
  chartPoints = [];

  /* 空状态 */
  if (data.length === 0){
    ctx.fillStyle = '#a7b2c6';
    ctx.font = '14px -apple-system,"PingFang SC",Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无数据，添加记录后这里会出现趋势图 ✨', W/2, H/2);
    return;
  }

  const pad = { t: 24, r: 20, b: 38, l: 50 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  /* Y 轴范围 */
  const vals = data.map(d => d.weight);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 1){ const mid = (mx + mn) / 2; mn = mid - 0.8; mx = mid + 0.8; }
  const padV = (mx - mn) * 0.2;
  mn -= padV; mx += padV;

  const xOf = i => data.length === 1
    ? pad.l + cw / 2
    : pad.l + (cw * i) / (data.length - 1);
  const yOf = v => pad.t + ch * (1 - (v - mn) / (mx - mn));

  /* --- 横向网格 + Y 轴刻度 --- */
  const rows = 4;
  ctx.font = '11px -apple-system,"PingFang SC",Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';

  for (let i=0; i<=rows; i++){
    const v = mn + (mx - mn) * (i / rows);
    const y = yOf(v);

    ctx.strokeStyle = '#eef2f9';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(pad.l + cw, y);
    ctx.stroke();

    ctx.fillStyle = '#a3aec2';
    ctx.fillText(v.toFixed(1), pad.l - 10, y);
  }

  /* --- X 轴日期标签 --- */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#a3aec2';

  const maxLabels = W < 520 ? 4 : 7;
  const step = Math.max(1, Math.ceil(data.length / maxLabels));

  data.forEach((d, i) => {
    if (i % step !== 0 && i !== data.length - 1) return;
    const x = xOf(i);
    const label = d.date.slice(5).replace('-', '/');
    if (i === data.length - 1 && i % step !== 0){
      ctx.textAlign = 'right';
    } else {
      ctx.textAlign = 'center';
    }
    ctx.fillText(label, x, pad.t + ch + 12);
  });

  /* --- 生成坐标点 --- */
  const pts = data.map((d, i) => ({ x: xOf(i), y: yOf(d.weight), rec: d }));
  chartPoints = pts;

  /* --- 动画裁剪 --- */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, pad.l + cw * reveal + 2, H);
  ctx.clip();

  /* --- 渐变填充区域 --- */
  if (pts.length > 1){
    curvePath(pts);
    ctx.lineTo(pts[pts.length-1].x, pad.t + ch);
    ctx.lineTo(pts[0].x, pad.t + ch);
    ctx.closePath();

    const fill = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
    fill.addColorStop(0,   'rgba(79,124,255,.30)');
    fill.addColorStop(0.55,'rgba(79,124,255,.10)');
    fill.addColorStop(1,   'rgba(34,211,166,.02)');
    ctx.fillStyle = fill;
    ctx.fill();
  }

  /* --- 主线 --- */
  if (pts.length > 1){
    curvePath(pts);
    const stroke = ctx.createLinearGradient(pad.l, 0, pad.l + cw, 0);
    stroke.addColorStop(0,   '#4f7cff');
    stroke.addColorStop(0.6, '#4aa8f5');
    stroke.addColorStop(1,   '#22d3a6');
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(79,124,255,.35)';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  /* --- 移动平均虚线 --- */
  if (showAvg && pts.length >= 3){
    const win = Math.min(7, Math.max(3, Math.floor(pts.length / 3)));
    const avgPts = [];
    for (let i=0; i<pts.length; i++){
      const from = Math.max(0, i - win + 1);
      const seg = vals.slice(from, i + 1);
      const m = seg.reduce((a,b)=>a+b,0) / seg.length;
      avgPts.push({ x: pts[i].x, y: yOf(m) });
    }
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = 'rgba(255,163,72,.9)';
    ctx.lineWidth = 2;
    curvePath(avgPts);
    ctx.stroke();
    ctx.restore();
  }

  /* --- 数据点 --- */
  pts.forEach((p, i) => {
    const isHover = i === hoverIndex;
    const isLast = i === pts.length - 1;

    if (isHover || isLast){
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHover ? 11 : 8, 0, Math.PI * 2);
      ctx.fillStyle = isHover ? 'rgba(79,124,255,.18)' : 'rgba(34,211,166,.16)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, isHover ? 5.5 : (isLast ? 4.8 : 3.6), 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = isHover ? 3 : 2.4;
    ctx.strokeStyle = isHover ? '#4f7cff' : (isLast ? '#22d3a6' : '#7f9dff');
    ctx.stroke();
  });

  ctx.restore();

  /* --- 最新数值气泡 --- */
  const last = pts[pts.length - 1];
  const text = last.rec.weight.toFixed(1);
  ctx.font = 'bold 12px -apple-system,"PingFang SC",Arial';
  const tw = ctx.measureText(text).width + 18;
  let bx = last.x - tw / 2;
  bx = Math.max(pad.l, Math.min(bx, pad.l + cw - tw));
  const by = Math.max(2, last.y - 30);

  ctx.fillStyle = '#1f2b45';
  ctx.beginPath();
  ctx.roundRect
    ? ctx.roundRect(bx, by, tw, 21, 8)
    : ctx.rect(bx, by, tw, 21);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + tw / 2, by + 11);
}

/* 入场动画 */
let animId = null;
function animateChart(){
  cancelAnimationFrame(animId);
  const t0 = performance.now();
  const dur = 720;

  function step(now){
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    drawChart(e);
    if (t < 1) animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}

/* =========================================================
   悬停提示
   ========================================================= */
function updateTip(){
  if (hoverIndex < 0 || !chartPoints[hoverIndex]){
    tip.style.opacity = 0;
    return;
  }
  const p = chartPoints[hoverIndex];
  const d = new Date(p.rec.date + 'T00:00:00');

  tip.innerHTML =
    '<b>' + p.rec.weight.toFixed(1) + ' kg</b>' +
    '<span>' + p.rec.date + ' 周' + WEEK[d.getDay()] +
    (p.rec.note ? ' · ' + p.rec.note : '') + '</span>';

  tip.style.left = p.x + 'px';
  tip.style.top  = p.y + 'px';
  tip.style.opacity = 1;
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;

  let best = -1, bestD = Infinity;
  chartPoints.forEach((p, i) => {
    const d = Math.abs(p.x - mx);
    if (d < bestD){ bestD = d; best = i; }
  });

  const next = (best >= 0 && bestD < 42) ? best : -1;
  if (next !== hoverIndex){
    hoverIndex = next;
    drawChart(1);
    updateTip();
  }
});

canvas.addEventListener('mouseleave', () => {
  hoverIndex = -1;
  tip.style.opacity = 0;
  drawChart(1);
});

/* =========================================================
   记录明细表
   ========================================================= */
function renderTable(){
  const all = sorted();
  countBox.textContent = all.length ? '共 ' + all.length + ' 条' : '';

  if (all.length === 0){
    tbody.innerHTML =
      '<tr><td colspan="6" class="empty">还没有记录，从今天开始吧 🌱</td></tr>';
    return;
  }

  let html = '';
  /* 倒序显示：最新的在最上面 */
  for (let i = all.length - 1; i >= 0; i--){
    const r = all[i];
    const d = new Date(r.date + 'T00:00:00');
    const prev = all[i-1];

    let chip = '<span class="chip flat">—</span>';
    if (prev){
      const diff = r.weight - prev.weight;
      if (Math.abs(diff) < 0.05){
        chip = '<span class="chip flat">0.0</span>';
      } else if (diff > 0){
        chip = '<span class="chip up">▲ +' + diff.toFixed(1) + '</span>';
      } else {
        chip = '<span class="chip down">▼ ' + diff.toFixed(1) + '</span>';
      }
    }

    html +=
      '<tr>' +
        '<td>' + r.date.slice(5).replace('-', '/') + '</td>' +
        '<td>周' + WEEK[d.getDay()] + '</td>' +
        '<td class="w">' + r.weight.toFixed(1) + '</td>' +
        '<td>' + chip + '</td>' +
        '<td class="note-cell">' + (r.note ? r.note : '—') + '</td>' +
        '<td><button class="del" data-i="' + i + '" title="删除">✕</button></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

/* =========================================================
   统一渲染
   ========================================================= */
function renderAll(animate){
  renderStats();
  renderTable();
  animate ? animateChart() : drawChart(1);
}

/* =========================================================
   交互事件
   ========================================================= */
$('add').addEventListener('click', () => {
  const date = dateInput.value;
  const weight = parseFloat(weightInput.value);

  if (!date){ alert('请选择日期'); return; }
  if (!weight || weight < 20 || weight > 300){
    alert('请输入 20 ~ 300 之间的体重（kg）');
    return;
  }

  const item = { date, weight, note: noteInput.value.trim() };
  const idx = records.findIndex(r => r.date === date);

  if (idx >= 0){
    records[idx] = item;          // 同一天则覆盖
  } else {
    records.push(item);
  }

  save();
  renderAll(true);

  weightInput.value = '';
  noteInput.value = '';
  weightInput.focus();
});

/* 回车快速提交 */
[weightInput, noteInput].forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') $('add').click();
  });
});

/* 删除单条 */
tbody.addEventListener('click', e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  if (confirm('删除 ' + sorted()[i].date + ' 的记录？')){
    const target = sorted()[i];
    records = records.filter(r => r !== target);
    save();
    renderAll(false);
  }
});

/* 清空全部 */
$('clear').addEventListener('click', () => {
  if (records.length === 0) return;
  if (confirm('确定清空全部记录吗？此操作不可恢复。')){
    records = [];
    save();
    renderAll(false);
  }
});

/* 时间范围切换 */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    range = Number(tab.dataset.range);
    hoverIndex = -1;
    tip.style.opacity = 0;
    animateChart();
  });
});

/* 均线开关 */
$('avgBtn').addEventListener('click', () => {
  showAvg = !showAvg;
  $('avgBtn').classList.toggle('on', showAvg);
  drawChart(1);
});

/* 窗口尺寸变化重绘 */
let rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => drawChart(1), 120);
});

/* 启动 */
renderAll(true);
</script>
</body>
</html>
