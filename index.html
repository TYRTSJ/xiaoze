<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>睡前体重记录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ================= 主题变量 ================= */
  :root{
    /* 清新插画配色 */
    --mint:#8fd6c0;
    --mint-deep:#4fb89a;
    --pink:#ffb3c6;
    --pink-deep:#f98ca8;
    --sky:#a8d8f0;
    --sky-deep:#6cb6dd;
    --butter:#ffe8a8;
    --lilac:#c9b8f0;

    --bg-1:#f3fbf7;
    --bg-2:#fdf6f9;
    --bg-3:#f2f9fd;

    --card:rgba(255,255,255,.78);
    --card-border:rgba(255,255,255,.9);
    --text:#3a4a55;
    --text-soft:#7d909c;
    --line:rgba(140,175,190,.16);

    --grain:rgba(143,214,192,.16);
    --shadow:0 10px 30px rgba(110,160,150,.13);
    --shadow-hover:0 16px 40px rgba(110,160,150,.20);

    --up:#f98ca8;
    --down:#4fb89a;

    --accent-grad:linear-gradient(120deg,#8fd6c0,#a8d8f0);
    --accent-text:#2f7d68;
  }

  [data-theme="dark"]{
    --bg-1:#1c2230;
    --bg-2:#232637;
    --bg-3:#1a2530;

    --card:rgba(44,52,68,.72);
    --card-border:rgba(255,255,255,.09);
    --text:#e8eef5;
    --text-soft:#93a4b8;
    --line:rgba(255,255,255,.09);

    --grain:rgba(143,214,192,.07);
    --shadow:0 10px 30px rgba(0,0,0,.28);
    --shadow-hover:0 16px 40px rgba(0,0,0,.38);

    --up:#ff9db3;
    --down:#6fd6b4;

    --accent-grad:linear-gradient(120deg,#5fc1a6,#6ca8d8);
    --accent-text:#8ce0c4;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100vh;
    padding:32px 16px 64px;
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(820px 560px at 6% -10%, var(--bg-1) 0%, transparent 60%),
      radial-gradient(760px 520px at 102% 0%, var(--bg-2) 0%, transparent 58%),
      radial-gradient(700px 700px at 50% 118%, var(--bg-3) 0%, transparent 62%),
      var(--bg-1);
    background-attachment:fixed;
    transition:background .5s ease, color .35s ease;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 背景装饰小圆点（插画感） */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-image:
      radial-gradient(circle, var(--grain) 1.6px, transparent 1.6px),
      radial-gradient(circle, var(--grain) 1.2px, transparent 1.2px);
    background-size:64px 64px, 96px 96px;
    background-position:0 0, 32px 40px;
    opacity:.9;
    transition:opacity .4s;
  }

  .app{
    position:relative;
    z-index:1;
    width:min(100%,900px);
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  /* ================= 顶部 ================= */
  .top-strip{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }

  .hero{flex:1;min-width:0;padding:4px 0 2px}
  .hero h1{
    font-size:28px;
    letter-spacing:.5px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .hero h1 .moon{
    display:inline-block;
    font-size:26px;
    animation:floaty 3.6s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-4px) rotate(4deg)}
  }
  .hero p{margin-top:7px;color:var(--text-soft);font-size:13px;line-height:1.6}

  /* 主题切换按钮 */
  .theme-btn{
    flex:0 0 auto;
    width:46px;height:46px;
    border:1.5px solid var(--card-border);
    border-radius:16px;
    background:var(--card);
    color:var(--text);
    font-size:20px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s, background .35s, border-color .35s;
  }
  .theme-btn:hover{transform:translateY(-3px) rotate(-8deg);box-shadow:var(--shadow-hover)}
  .theme-btn:active{transform:scale(.92)}

  /* ================= 卡片 ================= */
  .card{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:26px;
    padding:22px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    transition:background .4s, border-color .4s, box-shadow .3s;
    overflow:hidden;
  }
  /* 卡片角落的柔和晕染 */
  .card::after{
    content:"";
    position:absolute;
    top:-60px;right:-50px;
    width:170px;height:170px;
    border-radius:50%;
    background:radial-gradient(circle, var(--grain) 0%, transparent 70%);
    pointer-events:none;
  }

  /* ================= 登录页 ================= */
  .auth-wrap{
    position:relative;z-index:1;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .auth-card{
    position:relative;
    width:min(100%,410px);
    padding:38px 30px 32px;
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:30px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    animation:popIn .5s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes popIn{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:none}
  }
  .auth-emoji{
    width:66px;height:66px;margin:0 auto 16px;
    border-radius:22px;
    background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;
    box-shadow:0 10px 24px rgba(110,180,165,.28);
  }
  .auth-card h1{font-size:22px;text-align:center;margin-bottom:7px;font-weight:800}
  .auth-card .sub{text-align:center;color:var(--text-soft);font-size:13px;margin-bottom:26px}
  .auth-card input{
    width:100%;min-width:0;
    padding:14px 16px;margin-bottom:12px;
    border:1.5px solid var(--line);
    border-radius:16px;
    background:rgba(255,255,255,.5);
    color:var(--text);
    font-size:16px;font-family:inherit;
    transition:.25s;
  }
  [data-theme="dark"] .auth-card input{background:rgba(255,255,255,.05)}
  .auth-card input::placeholder{color:var(--text-soft);opacity:.75}
  .auth-card input:focus{
    outline:none;
    border-color:var(--mint);
    background:rgba(255,255,255,.85);
    box-shadow:0 0 0 4px rgba(143,214,192,.22);
  }
  [data-theme="dark"] .auth-card input:focus{background:rgba(255,255,255,.09)}

  .auth-btn{
    width:100%;padding:15px;
    border:none;border-radius:16px;margin-top:8px;
    background:var(--accent-grad);
    color:#fff;font-size:15px;font-weight:800;font-family:inherit;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(110,180,165,.32);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s, opacity .2s;
  }
  .auth-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(110,180,165,.4)}
  .auth-btn:active{transform:scale(.98)}
  .auth-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .auth-switch{text-align:center;margin-top:18px;font-size:13.5px;color:var(--text-soft)}
  .auth-switch a{color:var(--accent-text);font-weight:800;cursor:pointer;text-decoration:none;border-bottom:1.5px dashed currentColor}
  .auth-msg{
    margin-top:14px;padding:12px 15px;border-radius:14px;font-size:13px;
    display:none;line-height:1.6;
  }
  .auth-msg.err{display:block;background:rgba(249,140,168,.14);color:var(--up);border:1.5px solid rgba(249,140,168,.3)}
  .auth-msg.ok{display:block;background:rgba(143,214,192,.16);color:var(--down);border:1.5px solid rgba(143,214,192,.34)}

  /* 登录页主题按钮 */
  .auth-theme{
    position:fixed;top:18px;right:18px;z-index:5;
    top:calc(18px + env(safe-area-inset-top));
    right:calc(18px + env(safe-area-inset-right));
  }

  /* ================= 用户栏 ================= */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
  }
  .user-box{
    display:flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text-soft);min-width:0;
  }
  .user-box .email{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-weight:600;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--down);display:inline-block;flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(79,184,154,.16);
    transition:.3s;
  }
  .dot.syncing{background:var(--butter);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.35}}

  .logout{
    padding:9px 15px;
    border:1.5px solid var(--line);border-radius:13px;
    background:rgba(255,255,255,.42);
    color:var(--text-soft);
    font-size:12.5px;font-weight:700;font-family:inherit;
    cursor:pointer;flex:0 0 auto;transition:.24s;
  }
  [data-theme="dark"] .logout{background:rgba(255,255,255,.05)}
  .logout:hover{
    background:rgba(249,140,168,.14);
    border-color:rgba(249,140,168,.32);
    color:var(--up);
  }

  /* ================= 输入区 ================= */
  .form{display:grid;grid-template-columns:150px 1fr 1.5fr auto;gap:12px}
  .field{min-width:0}
  .field label{
    display:flex;align-items:center;gap:5px;
    margin-bottom:8px;
    font-size:12px;color:var(--text-soft);font-weight:700;
  }
  .field input{
    width:100%;min-width:0;
    padding:13px 15px;
    border:1.5px solid var(--line);
    border-radius:16px;
    background:rgba(255,255,255,.5);
    color:var(--text);
    font-size:16px;font-family:inherit;
    -webkit-appearance:none;appearance:none;
    transition:.25s;
  }
  [data-theme="dark"] .field input{background:rgba(255,255,255,.05)}
  .field input::placeholder{color:var(--text-soft);opacity:.7}
  .field input:focus{
    outline:none;
    border-color:var(--mint);
    background:rgba(255,255,255,.85);
    box-shadow:0 0 0 4px rgba(143,214,192,.22);
  }
  [data-theme="dark"] .field input:focus{background:rgba(255,255,255,.09)}
  .field.btn-field{display:flex;align-items:flex-end}

  .add-btn{
    width:100%;padding:13px 24px;
    border:none;border-radius:16px;
    background:var(--accent-grad);
    color:#fff;font-size:14.5px;font-weight:800;font-family:inherit;
    cursor:pointer;white-space:nowrap;
    box-shadow:0 8px 22px rgba(110,180,165,.3);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s, opacity .2s;
  }
  .add-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(110,180,165,.4)}
  .add-btn:active{transform:scale(.98)}
  .add-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

  /* ================= 概览卡 ================= */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--card-border);
    border-radius:22px;
    padding:17px 18px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    transition:transform .3s cubic-bezier(.34,1.4,.64,1), box-shadow .3s, background .4s;
    min-width:0;overflow:hidden;
  }
  .stat:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .stat .deco{
    position:absolute;top:12px;right:14px;
    font-size:17px;opacity:.55;
  }
  .stat .label{
    font-size:12px;color:var(--text-soft);font-weight:700;
    white-space:nowrap;padding-right:22px;
  }
  .stat .value{
    margin-top:9px;font-size:23px;font-weight:800;
    letter-spacing:-.4px;white-space:nowrap;
  }
  .stat .value small{font-size:12.5px;font-weight:700;color:var(--text-soft);margin-left:2px}
  .stat .bar{
    margin-top:10px;height:5px;border-radius:3px;
    background:var(--line);overflow:hidden;
  }
  .stat .bar i{
    display:block;height:100%;border-radius:3px;
    background:var(--accent-grad);
    transition:width .8s cubic-bezier(.34,1.2,.64,1);
  }
  .up{color:var(--up)} .down{color:var(--down)}

  /* ================= 图表 ================= */
  .chart-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:8px;
  }
  .chart-head h2{
    font-size:16.5px;font-weight:800;
    display:flex;align-items:center;gap:7px;
  }
  .chart-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .tabs{
    display:flex;gap:3px;padding:4px;
    background:var(--line);border-radius:14px;
    transition:background .4s;
  }
  .tab{
    padding:7px 14px;border:none;border-radius:11px;
    background:transparent;color:var(--text-soft);
    font-size:12.5px;font-weight:800;font-family:inherit;
    cursor:pointer;white-space:nowrap;
    transition:.24s;
  }
  .tab.active{
    background:var(--card);color:var(--accent-text);
    box-shadow:0 3px 10px rgba(110,160,150,.16);
  }

  .avg-toggle{
    display:flex;align-items:center;gap:6px;
    padding:8px 13px;
    border:1.5px solid var(--line);border-radius:13px;
    background:rgba(255,255,255,.4);
    color:var(--text-soft);
    font-size:12.5px;font-weight:800;font-family:inherit;
    cursor:pointer;white-space:nowrap;
    transition:.24s;
  }
  [data-theme="dark"] .avg-toggle{background:rgba(255,255,255,.05)}
  .avg-toggle.on{
    border-color:var(--mint);
    color:var(--accent-text);
    background:rgba(143,214,192,.16);
  }
  .avg-toggle i{width:16px;height:0;border-top:2px dashed currentColor;display:inline-block}

  .chart-wrap{position:relative;margin-top:12px}
  #chart{display:block;width:100%;height:290px;cursor:crosshair;touch-action:pan-y}

  #tip{
    position:absolute;pointer-events:none;opacity:0;
    transform:translate(-50%,-128%);
    padding:10px 14px;border-radius:14px;
    background:var(--text);
    color:var(--bg-1);
    font-size:12.5px;line-height:1.55;white-space:nowrap;
    box-shadow:0 10px 26px rgba(58,74,85,.3);
    transition:opacity .16s;
    z-index:5;
  }
  [data-theme="dark"] #tip{background:#e8eef5;color:#1c2230}
  #tip b{color:var(--mint-deep);font-size:14px}
  #tip span{display:block;color:var(--text-soft);font-size:11.5px;margin-top:2px}

  /* ================= 表格 ================= */
  .table-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .table-head h2{
    font-size:16.5px;font-weight:800;
    display:flex;align-items:center;gap:7px;
  }
  .table-head .count{color:var(--text-soft);font-size:12.5px;font-weight:700}
  .table-scroll{
    max-height:390px;overflow:auto;border-radius:18px;
    -webkit-overflow-scrolling:touch;
  }
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{
    position:sticky;top:0;z-index:2;
    padding:12px 8px;
    background:var(--card);
    color:var(--text-soft);
    font-size:12.5px;font-weight:800;text-align:center;
    border-bottom:1.5px solid var(--line);
    white-space:nowrap;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  tbody td{
    padding:12px 8px;text-align:center;
    border-bottom:1px solid var(--line);
    color:var(--text);white-space:nowrap;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .2s}
  tbody tr:hover{background:rgba(143,214,192,.09)}
  tbody td.w{font-weight:800;font-size:15px;color:var(--text)}
  .chip{
    display:inline-block;padding:4px 10px;border-radius:9px;
    font-size:12.5px;font-weight:800;
  }
  .chip.up{background:rgba(249,140,168,.18);color:var(--up)}
  .chip.down{background:rgba(79,184,154,.18);color:var(--down)}
  .chip.flat{background:var(--line);color:var(--text-soft)}
  .note-cell{
    color:var(--text-soft);font-size:13px;
    max-width:160px;overflow:hidden;text-overflow:ellipsis;
  }
  .del{
    width:30px;height:30px;border:none;border-radius:11px;
    background:rgba(249,140,168,.13);
    color:var(--up);font-size:15px;cursor:pointer;
    transition:.22s;
  }
  .del:hover{background:rgba(249,140,168,.26);transform:scale(1.1)}
  .empty{
    padding:48px 0;text-align:center;
    color:var(--text-soft);font-size:14px;white-space:normal;
  }

  /* ================= 响应式：平板 ================= */
  @media(max-width:760px){
    body{padding:22px 14px 52px;padding-bottom:calc(52px + env(safe-area-inset-bottom))}
    .hero h1{font-size:24px}
    .hero p{font-size:12.5px}
    .app{gap:16px}
    .card{padding:18px;border-radius:22px}
    .form{grid-template-columns:1fr 1fr;gap:11px}
    .form .note-field{grid-column:1/-1}
    .form .btn-field{grid-column:1/-1}
    .stats{grid-template-columns:1fr 1fr;gap:11px}
    .stat{padding:15px 16px;border-radius:19px}
    .stat .value{font-size:21px}
    #chart{height:240px}
    .table-scroll{max-height:none;overflow-x:auto}
    .note-cell{max-width:120px}
  }

  /* ================= 响应式：手机 ================= */
  @media(max-width:480px){
    body{padding:16px 12px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
    .app{gap:14px}
    .top-strip{gap:10px}
    .hero h1{font-size:21px;gap:7px}
    .hero h1 .moon{font-size:21px}
    .hero p{font-size:12px;margin-top:6px}
    .theme-btn{width:42px;height:42px;border-radius:14px;font-size:18px}
    .card{padding:16px;border-radius:20px}

    /* 输入区单列 */
    .form{grid-template-columns:1fr;gap:12px}
    .form .note-field{grid-column:auto}
    .form .btn-field{grid-column:auto}
    .add-btn{padding:15px}

    /* 概览两列 */
    .stats{grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:13px 14px;border-radius:17px}
    .stat .deco{font-size:15px;top:10px;right:11px}
    .stat .label{font-size:11px;padding-right:19px}
    .stat .value{font-size:19px;margin-top:7px}
    .stat .value small{font-size:11px}
    .stat .bar{margin-top:8px;height:4px}

    .topbar{padding:14px 16px}
    .user-box{font-size:12px}
    .logout{padding:8px 13px;font-size:12px}

    /* 图表工具栏 */
    .chart-head{gap:10px;margin-bottom:4px}
    .chart-head h2{font-size:15px;width:100%}
    .chart-tools{width:100%;gap:8px}
    .tabs{flex:1;min-width:0}
    .tab{flex:1;padding:8px 4px;font-size:12px;text-align:center}
    .avg-toggle{padding:9px 12px;font-size:12px}
    #chart{height:205px}

    /* 表格 */
    .table-head{margin-bottom:11px}
    .table-head h2{font-size:15px}
    thead th{padding:10px 5px;font-size:11.5px}
    tbody td{padding:11px 5px;font-size:12.5px}
    tbody td.w{font-size:14px}
    .chip{padding:3px 8px;font-size:11.5px}
    .note-cell{max-width:76px;font-size:12px}
    .del{width:27px;height:27px;border-radius:10px;font-size:14px}

    /* 登录 */
    .auth-wrap{padding:14px}
    .auth-card{padding:30px 22px 26px;border-radius:26px}
    .auth-emoji{width:58px;height:58px;border-radius:19px;font-size:28px;margin-bottom:14px}
    .auth-card h1{font-size:20px}
    .auth-card .sub{font-size:12.5px;margin-bottom:22px}
    .auth-theme{top:14px;right:14px;top:calc(14px + env(safe-area-inset-top));width:40px;height:40px}
  }

  /* 超窄屏 */
  @media(max-width:360px){
    .stats{grid-template-columns:1fr}
    .stat .value{font-size:20px}
    .note-cell{max-width:58px}
    thead th{font-size:11px;padding:9px 3px}
    tbody td{padding:10px 3px;font-size:12px}
  }

  /* 减少动画偏好 */
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<script>
/* ============================================================
   Supabase 配置
   ============================================================ */
const SUPABASE_URL      = 'https://zqwwhajsehypqvcdduwu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QcnfdQCv3zKbaiFDM6MK3g_Be13QlZJ';
/* ============================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const WEEK = ['日','一','二','三','四','五','六'];
const OLD_KEY = 'bedtime-weight-records';
const THEME_KEY = 'bedtime-weight-theme';

let records = [];
let user = null;
let isSignUp = false;
let range = 30;
let showAvg = true;
let hoverIndex = -1;
let chartPoints = [];

const $ = id => document.getElementById(id);
const canvas = $('chart'), ctx = canvas.getContext('2d');
const tip = $('tip');

/* ============================================================
   主题切换
   ============================================================ */
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || 'light';
}

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);

  const icon = theme === 'dark' ? '☀️' : '🌙';
  const title = theme === 'dark' ? '切换到浅色' : '切换到深色';

  ['themeBtn','themeBtnAuth'].forEach(id => {
    const el = $(id);
    if (el){ el.textContent = icon; el.title = title; }
  });

  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}

  // 主题变了，图表颜色也要跟着重绘
  if (user) drawChart(1);
}

function toggleTheme(){
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
}

/* 初始化主题：优先本地记录，其次系统偏好 */
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch(e){}

  if (saved === 'dark' || saved === 'light'){
    document.documentElement.setAttribute('data-theme', saved);
  } else {
    const prefersDark = window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  }

  // 等 DOM 好了再刷新按钮图标
  window.addEventListener('DOMContentLoaded', () => {
    const t = currentTheme();
    const icon = t === 'dark' ? '☀️' : '🌙';
    ['themeBtn','themeBtnAuth'].forEach(id => {
      const el = $(id);
      if (el) el.textContent = icon;
    });
  });
})();

/* ============================================================
   登录 / 注册
   ============================================================ */
$('switchLink').addEventListener('click', () => {
  isSignUp = !isSignUp;
  $('authBtn').textContent = isSignUp ? '注 册' : '登 录';
  $('switchText').textContent = isSignUp ? '已经有账号？' : '还没有账号？';
  $('switchLink').textContent = isSignUp ? '去登录' : '立即注册';
  $('authSub').textContent = isSignUp ? '注册后手机电脑自动同步' : '登录后手机电脑自动同步';
  hideMsg();
});

function showMsg(text, type){
  const el = $('authMsg');
  el.textContent = text;
  el.className = 'auth-msg ' + type;
}
function hideMsg(){ $('authMsg').className = 'auth-msg'; }

$('authBtn').addEventListener('click', doAuth);
[$('email'), $('password')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
});

async function doAuth(){
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !email.includes('@')) { showMsg('请输入有效的邮箱地址', 'err'); return; }
  if (password.length < 6) { showMsg('密码至少 6 位', 'err'); return; }

  const btn = $('authBtn');
  btn.disabled = true;
  btn.textContent = isSignUp ? '注册中...' : '登录中...';
  hideMsg();

  try {
    if (isSignUp) {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;

      if (!data.session) {
        showMsg('注册成功！请到邮箱点击确认链接后再登录。', 'ok');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
      }
      await enterApp();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enterApp();
    }
  } catch (err) {
    const msg = err.message || '操作失败';
    if (msg.includes('Invalid login')) showMsg('邮箱或密码错误', 'err');
    else if (msg.includes('already registered')) showMsg('这个邮箱已经注册过了，请直接登录', 'err');
    else showMsg(msg, 'err');

    btn.disabled = false;
    btn.textContent = isSignUp ? '注 册' : '登 录';
  }
}

$('logoutBtn').addEventListener('click', async () => {
  if (!confirm('确定退出登录吗？数据已保存在云端，不会丢失。')) return;
  await sb.auth.signOut();
});

/* ============================================================
   进入 / 离开应用
   ============================================================ */
async function enterApp(){
  const { data: { user: u } } = await sb.auth.getUser();
  if (!u) return;

  user = u;
  $('authScreen').style.display = 'none';
  $('app').style.display = 'flex';
  $('userEmail').textContent = user.email;

  const btn = $('authBtn');
  btn.disabled = false;
  btn.textContent = isSignUp ? '注 册' : '登 录';
  $('password').value = '';

  setSyncing(true);
  await loadRecords();
  setSyncing(false);

  await maybeMigrate();

  const d = new Date();
  $('date').value = d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');

  renderAll(true);
}

function backToLogin(){
  user = null;
  records = [];
  $('app').style.display = 'none';
  $('authScreen').style.display = 'flex';
  hideMsg();
}

function setSyncing(on){
  $('syncDot').classList.toggle('syncing', on);
}

/* ============================================================
   数据读写（未改动）
   ============================================================ */
async function loadRecords(){
  const { data, error } = await sb
    .from('weights')
    .select('id, date, weight, note')
    .order('date', { ascending: true });

  if (error) { alert('读取数据失败：' + error.message); return; }

  records = (data || []).map(r => ({
    id: r.id,
    date: r.date,
    weight: Number(r.weight),
    note: r.note || ''
  }));
}

async function maybeMigrate(){
  let local = [];
  try { local = JSON.parse(localStorage.getItem(OLD_KEY)) || []; } catch(e){}
  if (local.length === 0) return;
  if (records.length > 0) { localStorage.removeItem(OLD_KEY); return; }

  if (!confirm('检测到本机有 ' + local.length + ' 条旧记录，要上传到云端吗？')) {
    localStorage.removeItem(OLD_KEY);
    return;
  }

  setSyncing(true);
  const rows = local.map(r => ({
    user_id: user.id,
    date: r.date,
    weight: r.weight,
    note: r.note || ''
  }));

  const { error } = await sb.from('weights').upsert(rows, { onConflict: 'user_id,date' });
  setSyncing(false);

  if (error) { alert('迁移失败：' + error.message); return; }

  localStorage.removeItem(OLD_KEY);
  await loadRecords();
  alert('迁移完成，共 ' + rows.length + ' 条 ✅');
}

/* ============================================================
   概览
   ============================================================ */
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderStats(){
  const all = records;
  if (all.length === 0){ $('stats').innerHTML = ''; return; }

  const ws = all.map(r => r.weight);
  const latest = ws[ws.length-1];
  const total = latest - ws[0];
  const recent = ws.slice(-7);
  const avg = recent.reduce((a,b)=>a+b,0) / recent.length;

  const cls = v => v > 0.05 ? 'up' : (v < -0.05 ? 'down' : '');
  const sign = v => (v > 0 ? '+' : '') + v.toFixed(1);

  /* 打卡进度条：以 30 天为满 */
  const progress = Math.min(100, Math.round(all.length / 30 * 100));
  const maxW = Math.max(...ws), minW = Math.min(...ws);
  const spread = Math.max(0.1, maxW - minW);

  $('stats').innerHTML = `
    <div class="stat">
      <span class="deco">🗓️</span>
      <div class="label">记录天数</div>
      <div class="value">${all.length}<small>天</small></div>
      <div class="bar"><i style="width:${progress}%"></i></div>
    </div>
    <div class="stat">
      <span class="deco">⚖️</span>
      <div class="label">最新体重</div>
      <div class="value">${latest.toFixed(1)}<small>kg</small></div>
      <div class="bar"><i style="width:${Math.round((latest-minW)/spread*100)}%"></i></div>
    </div>
    <div class="stat">
      <span class="deco">${total > 0 ? '📈' : '📉'}</span>
      <div class="label">累计变化</div>
      <div class="value ${cls(total)}">${sign(total)}<small>kg</small></div>
      <div class="bar"><i style="width:${Math.round(Math.min(1, Math.abs(total)/5)*100)}%"></i></div>
    </div>
    <div class="stat">
      <span class="deco">✨</span>
      <div class="label">近 7 次平均</div>
      <div class="value">${avg.toFixed(1)}<small>kg</small></div>
      <div class="bar"><i style="width:${Math.round((avg-minW)/spread*100)}%"></i></div>
    </div>`;
}

/* ============================================================
   图表
   ============================================================ */
function filtered(){
  if (!range || records.length === 0) return records;
  const last = new Date(records[records.length-1].date + 'T00:00:00');
  const from = new Date(last);
  from.setDate(from.getDate() - (range - 1));
  return records.filter(r => new Date(r.date + 'T00:00:00') >= from);
}

function curvePath(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i], p1 = pts[i+1], mx = (p0.x + p1.x) / 2;
    ctx.bezierCurveTo(mx, p0.y, mx, p1.y, p1.x, p1.y);
  }
}

function drawChart(reveal = 1){
  const dark = currentTheme() === 'dark';

  /* 主题色 */
  const cLine1 = dark ? '#5fc1a6' : '#8fd6c0';
  const cLine2 = dark ? '#6ca8d8' : '#a8d8f0';
  const cGrid  = dark ? 'rgba(255,255,255,.07)' : 'rgba(140,175,190,.16)';
  const cLabel = dark ? '#93a4b8' : '#a3b5c0';
  const cDotBd = dark ? '#6ca8d8' : '#9fc6e6';
  const cBubble= dark ? '#e8eef5' : '#3a4a55';
  const cBubTx = dark ? '#1c2230' : '#f3fbf7';

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const data = filtered();
  chartPoints = [];

  if (data.length === 0){
    ctx.fillStyle = cLabel;
    ctx.font = '13px -apple-system,"PingFang SC",Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无数据，添加记录后这里会出现趋势图 ✨', W/2, H/2);
    return;
  }

  const narrow = W < 420;
  const fs = narrow ? 10 : 11;
  const pad = { t: 24, r: narrow ? 12 : 20, b: narrow ? 34 : 38, l: narrow ? 36 : 50 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  const vals = data.map(d => d.weight);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 1){ const mid = (mx + mn) / 2; mn = mid - 0.8; mx = mid + 0.8; }
  const padV = (mx - mn) * 0.2;
  mn -= padV; mx += padV;

  const xOf = i => data.length === 1 ? pad.l + cw/2 : pad.l + (cw * i) / (data.length - 1);
  const yOf = v => pad.t + ch * (1 - (v - mn) / (mx - mn));

  const rows = 4;
  ctx.font = fs + 'px -apple-system,"PingFang SC",Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= rows; i++){
    const v = mn + (mx - mn) * (i / rows);
    const y = yOf(v);
    ctx.strokeStyle = cGrid;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cw, y); ctx.stroke();
    ctx.fillStyle = cLabel;
    ctx.fillText(v.toFixed(1), pad.l - 8, y);
  }

  ctx.textBaseline = 'top';
  ctx.fillStyle = cLabel;
  const maxLabels = narrow ? 4 : (W < 620 ? 5 : 7);
  const step = Math.max(1, Math.ceil(data.length / maxLabels));
  data.forEach((d, i) => {
    if (i % step !== 0 && i !== data.length - 1) return;
    ctx.textAlign = (i === data.length - 1 && i % step !== 0) ? 'right' : 'center';
    ctx.fillText(d.date.slice(5).replace('-', '/'), xOf(i), pad.t + ch + 11);
  });

  const pts = data.map((d, i) => ({ x: xOf(i), y: yOf(d.weight), rec: d }));
  chartPoints = pts;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, pad.l + cw * reveal + 2, H);
  ctx.clip();

  if (pts.length > 1){
    curvePath(pts);
    ctx.lineTo(pts[pts.length-1].x, pad.t + ch);
    ctx.lineTo(pts[0].x, pad.t + ch);
    ctx.closePath();
    const fill = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
    if (dark){
      fill.addColorStop(0, 'rgba(95,193,166,.30)');
      fill.addColorStop(0.55, 'rgba(108,168,216,.12)');
      fill.addColorStop(1, 'rgba(108,168,216,.02)');
    } else {
      fill.addColorStop(0, 'rgba(143,214,192,.38)');
      fill.addColorStop(0.55, 'rgba(168,216,240,.16)');
      fill.addColorStop(1, 'rgba(255,179,198,.04)');
    }
    ctx.fillStyle = fill;
    ctx.fill();

    curvePath(pts);
    const stroke = ctx.createLinearGradient(pad.l, 0, pad.l + cw, 0);
    stroke.addColorStop(0, cLine1);
    stroke.addColorStop(0.6, dark ? '#79cfc0' : '#9fdde0');
    stroke.addColorStop(1, cLine2);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = narrow ? 3 : 3.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = dark ? 'rgba(95,193,166,.4)' : 'rgba(143,214,192,.5)';
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  if (showAvg && pts.length >= 3){
    const win = Math.min(7, Math.max(3, Math.floor(pts.length / 3)));
    const avgPts = [];
    for (let i = 0; i < pts.length; i++){
      const from = Math.max(0, i - win + 1);
      const seg = vals.slice(from, i + 1);
      avgPts.push({ x: pts[i].x, y: yOf(seg.reduce((a,b)=>a+b,0) / seg.length) });
    }
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = dark ? 'rgba(255,200,120,.85)' : 'rgba(255,196,120,.95)';
    ctx.lineWidth = 2;
    curvePath(avgPts);
    ctx.stroke();
    ctx.restore();
  }

  pts.forEach((p, i) => {
    const isHover = i === hoverIndex;
    const isLast = i === pts.length - 1;
    if (isHover || isLast){
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHover ? 12 : 9, 0, Math.PI * 2);
      ctx.fillStyle = isHover
        ? (dark ? 'rgba(108,168,216,.22)' : 'rgba(168,216,240,.3)')
        : (dark ? 'rgba(95,193,166,.2)' : 'rgba(143,214,192,.28)');
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, isHover ? 5.8 : (isLast ? 5 : 3.8), 0, Math.PI * 2);
    ctx.fillStyle = dark ? '#2c3444' : '#ffffff';
    ctx.fill();
    ctx.lineWidth = isHover ? 3.2 : 2.6;
    ctx.strokeStyle = isHover ? cDotBd : (isLast ? cLine1 : cDotBd);
    ctx.stroke();
  });

  ctx.restore();

  const last = pts[pts.length - 1];
  const text = last.rec.weight.toFixed(1);
  ctx.font = 'bold 12px -apple-system,"PingFang SC",Arial';
  const tw = ctx.measureText(text).width + 20;
  let bx = last.x - tw / 2;
  bx = Math.max(pad.l, Math.min(bx, pad.l + cw - tw));
  const by = Math.max(2, last.y - 31);
  ctx.fillStyle = cBubble;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, tw, 22, 11);
  else ctx.rect(bx, by, tw, 22);
  ctx.fill();
  ctx.fillStyle = cBubTx;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + tw / 2, by + 12);
}

let animId = null;
function animateChart(){
  cancelAnimationFrame(animId);
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / 720);
    drawChart(1 - Math.pow(1 - t, 3));
    if (t < 1) animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}

function showTipAt(clientX){
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  let best = -1, bestD = Infinity;
  chartPoints.forEach((p, i) => {
    const d = Math.abs(p.x - mx);
    if (d < bestD){ bestD = d; best = i; }
  });
  const next = (best >= 0 && bestD < 44) ? best : -1;
  if (next === hoverIndex) return;

  hoverIndex = next;
  drawChart(1);

  if (hoverIndex < 0 || !chartPoints[hoverIndex]){ tip.style.opacity = 0; return; }
  const p = chartPoints[hoverIndex];
  const d = new Date(p.rec.date + 'T00:00:00');
  tip.innerHTML = '<b>' + p.rec.weight.toFixed(1) + ' kg</b><span>' +
    p.rec.date + ' 周' + WEEK[d.getDay()] +
    (p.rec.note ? ' · ' + p.rec.note : '') + '</span>';
  tip.style.left = p.x + 'px';
  tip.style.top = p.y + 'px';
  tip.style.opacity = 1;
}

canvas.addEventListener('mousemove', e => showTipAt(e.clientX));
canvas.addEventListener('mouseleave', () => {
  hoverIndex = -1;
  tip.style.opacity = 0;
  drawChart(1);
});
canvas.addEventListener('touchstart', e => {
  if (e.touches.length) showTipAt(e.touches[0].clientX);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length) showTipAt(e.touches[0].clientX);
}, { passive: true });
canvas.addEventListener('touchend', () => {
  hoverIndex = -1;
  tip.style.opacity = 0;
  drawChart(1);
});

/* ============================================================
   表格
   ============================================================ */
function renderTable(){
  $('count').textContent = records.length ? '共 ' + records.length + ' 条' : '';

  if (records.length === 0){
    $('tbody').innerHTML = '<tr><td colspan="6" class="empty">还没有记录，从今天开始吧 🌱</td></tr>';
    return;
  }

  let html = '';
  for (let i = records.length - 1; i >= 0; i--){
    const r = records[i];
    const d = new Date(r.date + 'T00:00:00');
    const prev = records[i-1];
    let chip = '<span class="chip flat">—</span>';
    if (prev){
      const diff = r.weight - prev.weight;
      if (Math.abs(diff) < 0.05) chip = '<span class="chip flat">0.0</span>';
      else if (diff > 0) chip = '<span class="chip up">▲ +' + diff.toFixed(1) + '</span>';
      else chip = '<span class="chip down">▼ ' + diff.toFixed(1) + '</span>';
    }
    html += '<tr>' +
      '<td>' + r.date.slice(5).replace('-', '/') + '</td>' +
      '<td>周' + WEEK[d.getDay()] + '</td>' +
      '<td class="w">' + r.weight.toFixed(1) + '</td>' +
      '<td>' + chip + '</td>' +
      '<td class="note-cell">' + (r.note || '—') + '</td>' +
      '<td><button class="del" data-id="' + r.id + '">✕</button></td>' +
      '</tr>';
  }
  $('tbody').innerHTML = html;
}

function renderAll(animate){
  renderStats();
  renderTable();
  animate ? animateChart() : drawChart(1);
}

/* ============================================================
   交互
   ============================================================ */
$('add').addEventListener('click', async () => {
  const date = $('date').value;
  const weight = parseFloat($('weight').value);

  if (!date){ alert('请选择日期'); return; }
  if (!weight || weight < 20 || weight > 300){ alert('请输入 20 ~ 300 之间的体重'); return; }

  const btn = $('add');
  btn.disabled = true;
  btn.textContent = '保存中...';
  setSyncing(true);

  const { error } = await sb.from('weights').upsert({
    user_id: user.id,
    date,
    weight,
    note: $('note').value.trim()
  }, { onConflict: 'user_id,date' });

  if (error){
    alert('保存失败：' + error.message);
  } else {
    await loadRecords();
    renderAll(true);
    $('weight').value = '';
    $('note').value = '';
    $('weight').focus();
  }

  setSyncing(false);
  btn.disabled = false;
  btn.textContent = '＋ 记录';
});

[$('weight'), $('note')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });
});

$('tbody').addEventListener('click', async e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  const id = btn.dataset.id;
  if (!confirm('确定删除这条记录吗？')) return;

  setSyncing(true);
  const { error } = await sb.from('weights').delete().eq('id', id);
  if (error) alert('删除失败：' + error.message);
  else { await loadRecords(); renderAll(false); }
  setSyncing(false);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    range = Number(tab.dataset.range);
    hoverIndex = -1;
    tip.style.opacity = 0;
    animateChart();
  });
});

$('avgBtn').addEventListener('click', () => {
  showAvg = !showAvg;
  $('avgBtn').classList.toggle('on', showAvg);
  drawChart(1);
});

/* 主题按钮 */
$('themeBtn').addEventListener('click', toggleTheme);
$('themeBtnAuth').addEventListener('click', toggleTheme);

/* 跟系统主题联动（用户没手动选过时） */
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch(err){}
    if (!saved) applyTheme(e.matches ? 'dark' : 'light');
  });
}

let rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => drawChart(1), 120);
});

window.addEventListener('orientationchange', () => {
  setTimeout(() => drawChart(1), 300);
});

/* ============================================================
   启动
   ============================================================ */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterApp();
  else backToLogin();
})();

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') backToLogin();
});
</script>
</body>
</html>
