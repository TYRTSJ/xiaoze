<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>睡前体重记录 · 云同步版</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --text:#1f2b45; --muted:#8390a9; --line:#eaeff8;
    --primary:#4f7cff; --up:#f2555a; --down:#18b981;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    padding:36px 16px 64px;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
    padding-left:calc(16px + env(safe-area-inset-left));
    padding-right:calc(16px + env(safe-area-inset-right));
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 520px at 8% -12%, #dbe7ff 0%, transparent 62%),
      radial-gradient(820px 520px at 102% -4%, #d5fbef 0%, transparent 58%),
      linear-gradient(165deg,#eff5ff 0%,#e9fbf5 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* ✅ 关键修复：不再用 vw，避免和 body padding 叠加导致溢出 */
  .app{width:min(100%,900px);margin:0 auto;display:flex;flex-direction:column;gap:20px}

  .hero{text-align:center;padding:6px 0 2px}
  .hero h1{font-size:30px;letter-spacing:.5px;background:linear-gradient(100deg,#3d6bff,#12b98a 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin-top:8px;color:var(--muted);font-size:13.5px}

  .card{
    background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.9);
    border-radius:22px; padding:22px; box-shadow:0 14px 36px rgba(31,56,102,.09);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }

  /* ===== 登录页 ===== */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .auth-card{
    width:min(100%,400px); padding:34px 30px;
    background:rgba(255,255,255,.9); border:1px solid rgba(255,255,255,.9);
    border-radius:24px; box-shadow:0 20px 50px rgba(31,56,102,.14);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .auth-card h1{font-size:24px;text-align:center;margin-bottom:6px}
  .auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .auth-card input{
    width:100%;min-width:0;padding:13px 15px;margin-bottom:12px;
    border:1.5px solid #e2e9f5;border-radius:13px;background:#fbfdff;
    font-size:16px;font-family:inherit;transition:.22s;
  }
  .auth-card input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(79,124,255,.12)}
  .auth-btn{
    width:100%;padding:14px;border:none;border-radius:13px;margin-top:6px;
    background:linear-gradient(120deg,#4f7cff,#22c9a3);color:#fff;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
    box-shadow:0 8px 20px rgba(79,124,255,.28);transition:.2s;
  }
  .auth-btn:hover{transform:translateY(-2px)}
  .auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .auth-switch{text-align:center;margin-top:16px;font-size:13.5px;color:var(--muted)}
  .auth-switch a{color:var(--primary);font-weight:700;cursor:pointer;text-decoration:none}
  .auth-msg{margin-top:14px;padding:11px 14px;border-radius:11px;font-size:13px;display:none;line-height:1.6}
  .auth-msg.err{display:block;background:#fff0f0;color:#d64545;border:1px solid #ffd9d9}
  .auth-msg.ok{display:block;background:#e9fbf3;color:#128a63;border:1px solid #c4f0dd}

  /* ===== 输入区 ===== */
  .form{display:grid;grid-template-columns:150px 1fr 1.5fr auto;gap:12px}
  .field{min-width:0}
  .field label{display:block;margin-bottom:7px;font-size:12px;color:var(--muted);font-weight:600}
  .field input{
    width:100%;min-width:0;padding:12px 14px;
    border:1.5px solid #e2e9f5;border-radius:13px;background:#fbfdff;
    color:var(--text);font-size:16px;font-family:inherit;transition:.22s;
    -webkit-appearance:none;appearance:none;
  }
  .field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(79,124,255,.12)}
  .field.btn-field{display:flex;align-items:flex-end}
  .add-btn{
    width:100%;padding:13px 22px;border:none;border-radius:13px;
    background:linear-gradient(120deg,#4f7cff,#22c9a3);color:#fff;
    font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;
    box-shadow:0 8px 20px rgba(79,124,255,.28);transition:.2s;
  }
  .add-btn:hover{transform:translateY(-2px)}
  .add-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  /* ===== 顶栏 ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .user-box{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
  .user-box span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:#18b981;display:inline-block;flex:0 0 auto}
  .dot.syncing{background:#f5a623;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .logout{
    padding:8px 14px;border:1.5px solid #e2e9f5;border-radius:10px;background:#fbfdff;
    color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.2s;flex:0 0 auto;
  }
  .logout:hover{background:#fff0f0;border-color:#ffd9d9;color:#d64545}

  /* ===== 概览 ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{
    background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);
    border-radius:18px;padding:16px 18px;box-shadow:0 10px 26px rgba(31,56,102,.07);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.25s;
    min-width:0;
  }
  .stat:hover{transform:translateY(-3px)}
  .stat .label{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .stat .value{margin-top:8px;font-size:23px;font-weight:800;white-space:nowrap}
  .stat .value small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
  .up{color:var(--up)} .down{color:var(--down)}

  /* ===== 图表 ===== */
  .chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .chart-head h2{font-size:16.5px;font-weight:700}
  .chart-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:flex;gap:3px;padding:3px;background:#eef3fb;border-radius:11px}
  .tab{padding:7px 13px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;white-space:nowrap}
  .tab.active{background:#fff;color:var(--primary);box-shadow:0 3px 9px rgba(31,56,102,.10)}
  .avg-toggle{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px solid #e2e9f5;border-radius:11px;background:#fbfdff;color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;white-space:nowrap}
  .avg-toggle.on{border-color:var(--primary);color:var(--primary);background:#f3f7ff}
  .avg-toggle i{width:16px;height:0;border-top:2px dashed currentColor;display:inline-block}
  .chart-wrap{position:relative;margin-top:10px}
  #chart{display:block;width:100%;height:290px;cursor:crosshair;touch-action:pan-y}
  #tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-128%);padding:9px 13px;border-radius:12px;background:rgba(31,43,69,.94);color:#fff;font-size:12.5px;line-height:1.55;white-space:nowrap;box-shadow:0 10px 24px rgba(31,43,69,.28);transition:opacity .15s;z-index:5}
  #tip b{color:#7fe3c4;font-size:14px}
  #tip span{display:block;color:#b9c4d8;font-size:11.5px;margin-top:2px}

  /* ===== 表格 ===== */
  .table-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .table-head h2{font-size:16.5px;font-weight:700}
  .table-head .count{color:var(--muted);font-size:12.5px;font-weight:600}
  .table-scroll{max-height:390px;overflow:auto;border-radius:14px;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{position:sticky;top:0;z-index:2;padding:11px 8px;background:#f6f9ff;color:#5f6d88;font-size:12.5px;font-weight:700;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:12px 8px;text-align:center;border-bottom:1px solid #f3f6fc;color:#3b4761;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f9fbff}
  tbody td.w{font-weight:800;font-size:15px;color:#1f2b45}
  .chip{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12.5px;font-weight:700}
  .chip.up{background:#fff0f0;color:var(--up)}
  .chip.down{background:#e9fbf3;color:var(--down)}
  .chip.flat{background:#f1f4fa;color:#8c98ae}
  .note-cell{color:var(--muted);font-size:13px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
  .del{width:28px;height:28px;border:none;border-radius:9px;background:#fff2f2;color:#e05555;font-size:15px;cursor:pointer;transition:.2s}
  .del:hover{background:#ffdede;transform:scale(1.08)}
  .empty{padding:44px 0;text-align:center;color:#a7b2c6;font-size:14px;white-space:normal}

  /* ================= 平板 ================= */
  @media(max-width:760px){
    body{padding:22px 14px 52px;padding-bottom:calc(52px + env(safe-area-inset-bottom))}
    .hero h1{font-size:25px}
    .hero p{font-size:12.5px}
    .app{gap:16px}
    .card{padding:17px;border-radius:18px}
    .form{grid-template-columns:1fr 1fr;gap:10px}
    .form .note-field{grid-column:1/-1}
    .form .btn-field{grid-column:1/-1}
    .stats{grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:14px 15px;border-radius:16px}
    .stat .value{font-size:21px}
    #chart{height:240px}
    .table-scroll{max-height:none;overflow-x:auto}
    .note-cell{max-width:120px}
  }

  /* ================= 手机 ================= */
  @media(max-width:480px){
    body{padding:16px 12px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
    .app{gap:14px}
    .hero{padding:2px 0 0}
    .hero h1{font-size:21px}
    .hero p{font-size:12px;margin-top:6px}
    .card{padding:15px;border-radius:16px}

    /* 输入区：单列堆叠，不再挤在一起 */
    .form{grid-template-columns:1fr;gap:12px}
    .form .note-field{grid-column:auto}
    .form .btn-field{grid-column:auto}
    .add-btn{padding:14px}

    /* 概览卡：两列但收紧 */
    .stats{grid-template-columns:1fr 1fr;gap:9px}
    .stat{padding:12px 13px;border-radius:14px}
    .stat .label{font-size:11px}
    .stat .value{font-size:19px;margin-top:6px}
    .stat .value small{font-size:11px}

    /* 顶栏 */
    .topbar{padding:13px 15px}
    .user-box{font-size:12px}
    .logout{padding:7px 12px;font-size:12px}

    /* 图表工具栏铺满一行 */
    .chart-head{gap:10px;margin-bottom:2px}
    .chart-head h2{font-size:15px;width:100%}
    .chart-tools{width:100%;gap:7px}
    .tabs{flex:1;min-width:0}
    .tab{flex:1;padding:7px 4px;font-size:12px;text-align:center}
    .avg-toggle{padding:8px 11px;font-size:12px}
    #chart{height:205px}

    /* 表格：全面紧凑 */
    .table-head{margin-bottom:10px}
    .table-head h2{font-size:15px}
    thead th{padding:9px 5px;font-size:11.5px}
    tbody td{padding:11px 5px;font-size:12.5px}
    tbody td.w{font-size:14px}
    .chip{padding:2px 7px;font-size:11.5px}
    .note-cell{max-width:76px;font-size:12px}
    .del{width:26px;height:26px;font-size:14px}

    /* 登录卡片 */
    .auth-wrap{padding:14px}
    .auth-card{padding:26px 20px;border-radius:20px}
    .auth-card h1{font-size:21px}
    .auth-card .sub{font-size:12.5px;margin-bottom:20px}
    .auth-card input{padding:13px 14px;margin-bottom:11px}
  }

  /* 超窄屏（iPhone SE 等） */
  @media(max-width:360px){
    .stats{grid-template-columns:1fr}
    .stat .value{font-size:20px}
    .note-cell{max-width:60px}
    thead th{font-size:11px;padding:8px 3px}
    tbody td{padding:10px 3px;font-size:12px}
  }
</style>
</head>
<body>

<!-- ================= 登录界面 ================= -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h1>🌙 睡前体重记录</h1>
    <p class="sub" id="authSub">登录后手机电脑自动同步</p>

    <input type="email" id="email" placeholder="邮箱" autocomplete="email" inputmode="email">
    <input type="password" id="password" placeholder="密码（至少 6 位）" autocomplete="current-password">

    <button class="auth-btn" id="authBtn">登 录</button>

    <div class="auth-msg" id="authMsg"></div>

    <p class="auth-switch">
      <span id="switchText">还没有账号？</span>
      <a id="switchLink">立即注册</a>
    </p>
  </div>
</div>

<!-- ================= 主应用 ================= -->
<div class="app" id="app" style="display:none">

  <div class="hero">
    <h1>🌙 睡前体重记录</h1>
    <p>数据已云端同步 · 每天同一时间测量更准确</p>
  </div>

  <div class="card topbar">
    <div class="user-box">
      <span class="dot" id="syncDot"></span>
      <span id="userEmail">—</span>
    </div>
    <button class="logout" id="logoutBtn">退出登录</button>
  </div>

  <div class="card">
    <div class="form">
      <div class="field">
        <label>日期</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label>体重 (kg)</label>
        <input type="number" id="weight" step="0.1" min="20" max="300" placeholder="如 62.5" inputmode="decimal">
      </div>
      <div class="field note-field">
        <label>备注</label>
        <input type="text" id="note" maxlength="24" placeholder="晚餐 / 运动 / 睡眠（可选）">
      </div>
      <div class="field btn-field">
        <button class="add-btn" id="add">＋ 记录</button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="chart-head">
      <h2>📈 体重趋势</h2>
      <div class="chart-tools">
        <div class="tabs">
          <button class="tab" data-range="7">近 7 天</button>
          <button class="tab active" data-range="30">近 30 天</button>
          <button class="tab" data-range="0">全部</button>
        </div>
        <button class="avg-toggle on" id="avgBtn"><i></i>均线</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="tip"></div>
    </div>
  </div>

  <div class="card">
    <div class="table-head">
      <h2>📋 记录明细 <span class="count" id="count"></span></h2>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>日期</th><th>星期</th><th>体重</th><th>较前次</th><th>备注</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/* ============================================================
   你的 Supabase 配置（已填好）
   ============================================================ */
const SUPABASE_URL      = 'https://zqwwhajsehypqvcdduwu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QcnfdQCv3zKbaiFDM6MK3g_Be13QlZJ';
/* ============================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const WEEK = ['日','一','二','三','四','五','六'];
const OLD_KEY = 'bedtime-weight-records';

let records = [];
let user = null;
let isSignUp = false;
let range = 30;
let showAvg = true;
let hoverIndex = -1;
let chartPoints = [];

const $ = id => document.getElementById(id);
const canvas = $('chart'), ctx = canvas.getContext('2d');
const tip = $('tip');

/* ============================================================
   登录 / 注册
   ============================================================ */
$('switchLink').addEventListener('click', () => {
  isSignUp = !isSignUp;
  $('authBtn').textContent = isSignUp ? '注 册' : '登 录';
  $('switchText').textContent = isSignUp ? '已经有账号？' : '还没有账号？';
  $('switchLink').textContent = isSignUp ? '去登录' : '立即注册';
  $('authSub').textContent = isSignUp ? '注册后手机电脑自动同步' : '登录后手机电脑自动同步';
  hideMsg();
});

function showMsg(text, type){
  const el = $('authMsg');
  el.textContent = text;
  el.className = 'auth-msg ' + type;
}
function hideMsg(){ $('authMsg').className = 'auth-msg'; }

$('authBtn').addEventListener('click', doAuth);
[$('email'), $('password')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
});

async function doAuth(){
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !email.includes('@')) { showMsg('请输入有效的邮箱地址', 'err'); return; }
  if (password.length < 6) { showMsg('密码至少 6 位', 'err'); return; }

  const btn = $('authBtn');
  btn.disabled = true;
  btn.textContent = isSignUp ? '注册中...' : '登录中...';
  hideMsg();

  try {
    if (isSignUp) {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;

      if (!data.session) {
        showMsg('注册成功！请到邮箱点击确认链接后再登录。', 'ok');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
      }
      await enterApp();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await enterApp();
    }
  } catch (err) {
    const msg = err.message || '操作失败';
    if (msg.includes('Invalid login')) showMsg('邮箱或密码错误', 'err');
    else if (msg.includes('already registered')) showMsg('这个邮箱已经注册过了，请直接登录', 'err');
    else showMsg(msg, 'err');

    btn.disabled = false;
    btn.textContent = isSignUp ? '注 册' : '登 录';
  }
}

$('logoutBtn').addEventListener('click', async () => {
  if (!confirm('确定退出登录吗？数据已保存在云端，不会丢失。')) return;
  await sb.auth.signOut();
});

/* ============================================================
   进入 / 离开应用
   ============================================================ */
async function enterApp(){
  const { data: { user: u } } = await sb.auth.getUser();
  if (!u) return;

  user = u;
  $('authScreen').style.display = 'none';
  $('app').style.display = 'flex';
  $('userEmail').textContent = user.email;

  const btn = $('authBtn');
  btn.disabled = false;
  btn.textContent = isSignUp ? '注 册' : '登 录';
  $('password').value = '';

  setSyncing(true);
  await loadRecords();
  setSyncing(false);

  await maybeMigrate();

  const d = new Date();
  $('date').value = d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');

  renderAll(true);
}

function backToLogin(){
  user = null;
  records = [];
  $('app').style.display = 'none';
  $('authScreen').style.display = 'flex';
  hideMsg();
}

function setSyncing(on){
  $('syncDot').classList.toggle('syncing', on);
}

/* ============================================================
   数据读写
   ============================================================ */
async function loadRecords(){
  const { data, error } = await sb
    .from('weights')
    .select('id, date, weight, note')
    .order('date', { ascending: true });

  if (error) { alert('读取数据失败：' + error.message); return; }

  records = (data || []).map(r => ({
    id: r.id,
    date: r.date,
    weight: Number(r.weight),
    note: r.note || ''
  }));
}

/* 把本机旧数据搬到云端（只做一次） */
async function maybeMigrate(){
  let local = [];
  try { local = JSON.parse(localStorage.getItem(OLD_KEY)) || []; } catch(e){}
  if (local.length === 0) return;
  if (records.length > 0) { localStorage.removeItem(OLD_KEY); return; }

  if (!confirm('检测到本机有 ' + local.length + ' 条旧记录，要上传到云端吗？')) {
    localStorage.removeItem(OLD_KEY);
    return;
  }

  setSyncing(true);
  const rows = local.map(r => ({
    user_id: user.id,
    date: r.date,
    weight: r.weight,
    note: r.note || ''
  }));

  const { error } = await sb.from('weights').upsert(rows, { onConflict: 'user_id,date' });
  setSyncing(false);

  if (error) { alert('迁移失败：' + error.message); return; }

  localStorage.removeItem(OLD_KEY);
  await loadRecords();
  alert('迁移完成，共 ' + rows.length + ' 条 ✅');
}

/* ============================================================
   概览
   ============================================================ */
function renderStats(){
  const all = records;
  if (all.length === 0){ $('stats').innerHTML = ''; return; }

  const ws = all.map(r => r.weight);
  const latest = ws[ws.length-1];
  const total = latest - ws[0];
  const recent = ws.slice(-7);
  const avg = recent.reduce((a,b)=>a+b,0) / recent.length;

  const cls = v => v > 0.05 ? 'up' : (v < -0.05 ? 'down' : '');
  const sign = v => (v > 0 ? '+' : '') + v.toFixed(1);

  $('stats').innerHTML = `
    <div class="stat"><div class="label">记录天数</div>
      <div class="value">${all.length}<small>天</small></div></div>
    <div class="stat"><div class="label">最新体重</div>
      <div class="value">${latest.toFixed(1)}<small>kg</small></div></div>
    <div class="stat"><div class="label">累计变化</div>
      <div class="value ${cls(total)}">${sign(total)}<small>kg</small></div></div>
    <div class="stat"><div class="label">近 7 次平均</div>
      <div class="value">${avg.toFixed(1)}<small>kg</small></div></div>`;
}

/* ============================================================
   图表
   ============================================================ */
function filtered(){
  if (!range || records.length === 0) return records;
  const last = new Date(records[records.length-1].date + 'T00:00:00');
  const from = new Date(last);
  from.setDate(from.getDate() - (range - 1));
  return records.filter(r => new Date(r.date + 'T00:00:00') >= from);
}

function curvePath(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i], p1 = pts[i+1], mx = (p0.x + p1.x) / 2;
    ctx.bezierCurveTo(mx, p0.y, mx, p1.y, p1.x, p1.y);
  }
}

function drawChart(reveal = 1){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const data = filtered();
  chartPoints = [];

  if (data.length === 0){
    ctx.fillStyle = '#a7b2c6';
    ctx.font = '13px -apple-system,"PingFang SC",Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暂无数据，添加记录后这里会出现趋势图 ✨', W/2, H/2);
    return;
  }

  /* ✅ 窄屏时收紧内边距和字号 */
  const narrow = W < 420;
  const fs = narrow ? 10 : 11;
  const pad = { t: 24, r: narrow ? 12 : 20, b: narrow ? 34 : 38, l: narrow ? 36 : 50 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;

  const vals = data.map(d => d.weight);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mx - mn < 1){ const mid = (mx + mn) / 2; mn = mid - 0.8; mx = mid + 0.8; }
  const padV = (mx - mn) * 0.2;
  mn -= padV; mx += padV;

  const xOf = i => data.length === 1 ? pad.l + cw/2 : pad.l + (cw * i) / (data.length - 1);
  const yOf = v => pad.t + ch * (1 - (v - mn) / (mx - mn));

  const rows = 4;
  ctx.font = fs + 'px -apple-system,"PingFang SC",Arial';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i <= rows; i++){
    const v = mn + (mx - mn) * (i / rows);
    const y = yOf(v);
    ctx.strokeStyle = '#eef2f9';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cw, y); ctx.stroke();
    ctx.fillStyle = '#a3aec2';
    ctx.fillText(v.toFixed(1), pad.l - 8, y);
  }

  ctx.textBaseline = 'top';
  ctx.fillStyle = '#a3aec2';
  const maxLabels = narrow ? 4 : (W < 620 ? 5 : 7);
  const step = Math.max(1, Math.ceil(data.length / maxLabels));
  data.forEach((d, i) => {
    if (i % step !== 0 && i !== data.length - 1) return;
    ctx.textAlign = (i === data.length - 1 && i % step !== 0) ? 'right' : 'center';
    ctx.fillText(d.date.slice(5).replace('-', '/'), xOf(i), pad.t + ch + 11);
  });

  const pts = data.map((d, i) => ({ x: xOf(i), y: yOf(d.weight), rec: d }));
  chartPoints = pts;

  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, pad.l + cw * reveal + 2, H);
  ctx.clip();

  if (pts.length > 1){
    curvePath(pts);
    ctx.lineTo(pts[pts.length-1].x, pad.t + ch);
    ctx.lineTo(pts[0].x, pad.t + ch);
    ctx.closePath();
    const fill = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
    fill.addColorStop(0, 'rgba(79,124,255,.30)');
    fill.addColorStop(0.55, 'rgba(79,124,255,.10)');
    fill.addColorStop(1, 'rgba(34,211,166,.02)');
    ctx.fillStyle = fill;
    ctx.fill();

    curvePath(pts);
    const stroke = ctx.createLinearGradient(pad.l, 0, pad.l + cw, 0);
    stroke.addColorStop(0, '#4f7cff');
    stroke.addColorStop(0.6, '#4aa8f5');
    stroke.addColorStop(1, '#22d3a6');
    ctx.strokeStyle = stroke;
    ctx.lineWidth = narrow ? 2.5 : 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(79,124,255,.35)';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  if (showAvg && pts.length >= 3){
    const win = Math.min(7, Math.max(3, Math.floor(pts.length / 3)));
    const avgPts = [];
    for (let i = 0; i < pts.length; i++){
      const from = Math.max(0, i - win + 1);
      const seg = vals.slice(from, i + 1);
      avgPts.push({ x: pts[i].x, y: yOf(seg.reduce((a,b)=>a+b,0) / seg.length) });
    }
    ctx.save();
    ctx.setLineDash([6, 5]);
    ctx.strokeStyle = 'rgba(255,163,72,.9)';
    ctx.lineWidth = 2;
    curvePath(avgPts);
    ctx.stroke();
    ctx.restore();
  }

  pts.forEach((p, i) => {
    const isHover = i === hoverIndex;
    const isLast = i === pts.length - 1;
    if (isHover || isLast){
      ctx.beginPath();
      ctx.arc(p.x, p.y, isHover ? 11 : 8, 0, Math.PI * 2);
      ctx.fillStyle = isHover ? 'rgba(79,124,255,.18)' : 'rgba(34,211,166,.16)';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, isHover ? 5.5 : (isLast ? 4.8 : 3.6), 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = isHover ? 3 : 2.4;
    ctx.strokeStyle = isHover ? '#4f7cff' : (isLast ? '#22d3a6' : '#7f9dff');
    ctx.stroke();
  });

  ctx.restore();

  const last = pts[pts.length - 1];
  const text = last.rec.weight.toFixed(1);
  ctx.font = 'bold 12px -apple-system,"PingFang SC",Arial';
  const tw = ctx.measureText(text).width + 18;
  let bx = last.x - tw / 2;
  bx = Math.max(pad.l, Math.min(bx, pad.l + cw - tw));
  const by = Math.max(2, last.y - 30);
  ctx.fillStyle = '#1f2b45';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, tw, 21, 8);
  else ctx.rect(bx, by, tw, 21);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + tw / 2, by + 11);
}

let animId = null;
function animateChart(){
  cancelAnimationFrame(animId);
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / 720);
    drawChart(1 - Math.pow(1 - t, 3));
    if (t < 1) animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}

/* 查找最近的数据点并显示提示 */
function showTipAt(clientX){
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  let best = -1, bestD = Infinity;
  chartPoints.forEach((p, i) => {
    const d = Math.abs(p.x - mx);
    if (d < bestD){ bestD = d; best = i; }
  });
  const next = (best >= 0 && bestD < 44) ? best : -1;
  if (next === hoverIndex) return;

  hoverIndex = next;
  drawChart(1);

  if (hoverIndex < 0 || !chartPoints[hoverIndex]){ tip.style.opacity = 0; return; }
  const p = chartPoints[hoverIndex];
  const d = new Date(p.rec.date + 'T00:00:00');
  tip.innerHTML = '<b>' + p.rec.weight.toFixed(1) + ' kg</b><span>' +
    p.rec.date + ' 周' + WEEK[d.getDay()] +
    (p.rec.note ? ' · ' + p.rec.note : '') + '</span>';
  tip.style.left = p.x + 'px';
  tip.style.top = p.y + 'px';
  tip.style.opacity = 1;
}

/* 鼠标 */
canvas.addEventListener('mousemove', e => showTipAt(e.clientX));
canvas.addEventListener('mouseleave', () => {
  hoverIndex = -1;
  tip.style.opacity = 0;
  drawChart(1);
});

/* ✅ 触摸（手机） */
canvas.addEventListener('touchstart', e => {
  if (e.touches.length) showTipAt(e.touches[0].clientX);
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length) showTipAt(e.touches[0].clientX);
}, { passive: true });

canvas.addEventListener('touchend', () => {
  hoverIndex = -1;
  tip.style.opacity = 0;
  drawChart(1);
});

/* ============================================================
   表格
   ============================================================ */
function renderTable(){
  $('count').textContent = records.length ? '共 ' + records.length + ' 条' : '';

  if (records.length === 0){
    $('tbody').innerHTML = '<tr><td colspan="6" class="empty">还没有记录，从今天开始吧 🌱</td></tr>';
    return;
  }

  let html = '';
  for (let i = records.length - 1; i >= 0; i--){
    const r = records[i];
    const d = new Date(r.date + 'T00:00:00');
    const prev = records[i-1];
    let chip = '<span class="chip flat">—</span>';
    if (prev){
      const diff = r.weight - prev.weight;
      if (Math.abs(diff) < 0.05) chip = '<span class="chip flat">0.0</span>';
      else if (diff > 0) chip = '<span class="chip up">▲ +' + diff.toFixed(1) + '</span>';
      else chip = '<span class="chip down">▼ ' + diff.toFixed(1) + '</span>';
    }
    html += '<tr>' +
      '<td>' + r.date.slice(5).replace('-', '/') + '</td>' +
      '<td>周' + WEEK[d.getDay()] + '</td>' +
      '<td class="w">' + r.weight.toFixed(1) + '</td>' +
      '<td>' + chip + '</td>' +
      '<td class="note-cell">' + (r.note || '—') + '</td>' +
      '<td><button class="del" data-id="' + r.id + '">✕</button></td>' +
      '</tr>';
  }
  $('tbody').innerHTML = html;
}

function renderAll(animate){
  renderStats();
  renderTable();
  animate ? animateChart() : drawChart(1);
}

/* ============================================================
   交互
   ============================================================ */
$('add').addEventListener('click', async () => {
  const date = $('date').value;
  const weight = parseFloat($('weight').value);

  if (!date){ alert('请选择日期'); return; }
  if (!weight || weight < 20 || weight > 300){ alert('请输入 20 ~ 300 之间的体重'); return; }

  const btn = $('add');
  btn.disabled = true;
  btn.textContent = '保存中...';
  setSyncing(true);

  const { error } = await sb.from('weights').upsert({
    user_id: user.id,
    date,
    weight,
    note: $('note').value.trim()
  }, { onConflict: 'user_id,date' });

  if (error){
    alert('保存失败：' + error.message);
  } else {
    await loadRecords();
    renderAll(true);
    $('weight').value = '';
    $('note').value = '';
    $('weight').focus();
  }

  setSyncing(false);
  btn.disabled = false;
  btn.textContent = '＋ 记录';
});

[$('weight'), $('note')].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });
});

$('tbody').addEventListener('click', async e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  const id = btn.dataset.id;
  if (!confirm('确定删除这条记录吗？')) return;

  setSyncing(true);
  const { error } = await sb.from('weights').delete().eq('id', id);
  if (error) alert('删除失败：' + error.message);
  else { await loadRecords(); renderAll(false); }
  setSyncing(false);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    range = Number(tab.dataset.range);
    hoverIndex = -1;
    tip.style.opacity = 0;
    animateChart();
  });
});

$('avgBtn').addEventListener('click', () => {
  showAvg = !showAvg;
  $('avgBtn').classList.toggle('on', showAvg);
  drawChart(1);
});

let rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => drawChart(1), 120);
});

/* 手机上地址栏收起/展开会触发高度变化 */
window.addEventListener('orientationchange', () => {
  setTimeout(() => drawChart(1), 300);
});

/* ============================================================
   启动
   ============================================================ */
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session) await enterApp();
  else backToLogin();
})();

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') backToLogin();
});
</script>
